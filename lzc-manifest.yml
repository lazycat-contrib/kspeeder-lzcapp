application:
  subdomain: kspeeder
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://kspeeder:5003/
  ingress:
    - protocol: tcp
      port: 5443
      service: kspeeder

services:
  kspeeder:
    # upstream: linkease/kspeeder:0.3.0
    image: docker.1ms.run/linkease/kspeeder:0.3.0
    binds:
      - /lzcapp/var/data:/kspeeder-data
      - /lzcapp/var/config:/kspeeder-config
