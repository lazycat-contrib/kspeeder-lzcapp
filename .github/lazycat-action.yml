version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/kspeeder.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: kspeeder

build:
  run_buildscript: false

images:
  - id: kspeeder
    target: service
    service: kspeeder
    source: linkease/kspeeder
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: KSpeeder
    summary: "Docker 镜像加速专家"
